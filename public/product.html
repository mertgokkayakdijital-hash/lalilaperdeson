<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem("lalila_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <title>Ürün Detayı | Lalila Perde Sistemleri</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="pageLoader" class="page-loader" aria-hidden="true">
    <div class="loader-inner">
      <img src="/images/logo.png" alt="Logo" class="loader-logo" onerror="this.style.display='none'">
      <div class="loader-curtain">
        <span></span><span></span><span></span>
      </div>
      <p class="loader-text">Yükleniyor...</p>
    </div>
  </div>

  <header class="main-header">
    <div class="container">
      <nav class="navbar">
        <a href="/" class="logo" aria-label="Ana Sayfa">
          <img src="/images/logo.png" alt="Logo" class="brand-logo-img" id="navbarLogoImg" onerror="this.style.display='none';document.getElementById('navbarLogoFallback').style.display='inline';">
          <span class="logo-text" id="navbarLogoFallback" style="display:none;">Lalila</span>
        </a>
        <ul class="nav-links">
          <li><a href="/">Ana Sayfa</a></li>
          <li><a href="/catalog">Katalog</a></li>
          <li><a href="/#how-it-works">Nasıl Çalışır?</a></li>
          <li><a href="/#contact">İletişim</a></li>
        </ul>
        <a href="/catalog" class="favorite-btn">
          <span class="icon">❤️</span>
          <span class="badge">0</span>
          <span class="text">Favorilerim</span>
        </a>
        <a href="/#contact" class="cta-btn">Ücretsiz Keşif Al</a>
        <button class="menu-toggle" aria-label="Menüyü aç" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 120px; padding-bottom: 80px;">
    <a href="/catalog" style="display: inline-block; margin-bottom: 24px; color: var(--text-primary); text-decoration: none; font-weight: 500;">← Kataloğa Dön</a>
    <div id="productDetailWrapper" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; align-items: start;">
      <div id="productImageBox" style="aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; background: var(--bg-secondary); position: relative;">
        <img id="productImg" src="" alt="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
        <span id="productBadge" class="product-badge" style="display:none;"></span>
      </div>
      <div>
        <span id="productCat" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 600;"></span>
        <h1 class="section-title" id="productTitle" style="text-align: left; margin: 8px 0 14px;">Ürün Yükleniyor...</h1>
        <p id="productPrice" style="font-size: 1.3rem; font-weight: 600; color: var(--accent); margin-bottom: 14px;"></p>
        <p class="section-subtitle" id="productDesc" style="text-align: left; margin-bottom: 18px;"></p>
        <p id="productMeta" style="margin-bottom: 24px; color: var(--text-secondary); font-size: 0.9rem;"></p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px;">
          <button type="button" class="fav-toggle-btn" id="productFav" style="background:none;border:1px solid rgba(28,28,28,0.2);padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:500;">🤍 Favori</button>
          <a id="productWaBtn" href="#" target="_blank" rel="noopener" class="cta-btn" style="background: #25D366; color: #fff;">WhatsApp ile Bilgi Al</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
